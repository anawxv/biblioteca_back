<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca offline</title>
    <style>
      :root {
        color: #333333;
        background: #ffffff;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 390px);
        border-radius: 28px;
        background: #ffe6f2;
        padding: 28px;
        text-align: center;
        box-shadow: 0 20px 48px rgba(255, 102, 179, 0.18);
      }

      h1 {
        margin: 0 0 12px;
        color: #ff4da6;
        font-size: 1.7rem;
      }

      p {
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Biblioteca</h1>
      <p>Você está offline. Conecte-se à internet para acessar os dados atualizados da biblioteca.</p>
    </main>
  </body>
</html>
